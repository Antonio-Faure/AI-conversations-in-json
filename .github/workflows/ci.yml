name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes src run.py scripts tests
      - name: Tests (hors RAG, torch non installe)
        run: python -m pytest -q --ignore=tests/test_rag.py
      - name: Aucune trace personnelle
        run: python scripts/sanitize.py --check
