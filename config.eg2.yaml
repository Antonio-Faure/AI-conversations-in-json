# AI Conversations in JSON — configuration EmbeddingGemma 2 (index dedie)
# Variante de config.yaml pour construire un RAG parallele avec
# google/embeddinggemma-2 (768 dims) dans rag/messages-eg2.db, sans toucher
# a l'index bge-m3 (rag/messages.db) utilise par le cron et le site.
#
#   .venv/bin/python scripts/rag_index.py --config config.eg2.yaml
#   .venv/bin/python scripts/rag_search.py --config config.eg2.yaml "requete"

# Chemins relatifs a la racine du depot (portable).
output_dir: exports
profile_dir: profiles
cookies_dir: cookies
rag_db: rag/messages-eg2.db
rag_model: google/embeddinggemma-2   # embeddings locaux multimodaux (768 dims)
rag_dim: 768                         # EmbeddingGemma 2 ; 0 = deduit du modele

# Console uniquement : aucun log sur disque, aucun dossier par session.
screenshot_dir: ""

headless: true                 # false pour debugger ou pour la premiere connexion
timeout_ms: 45000              # navigation + actions
pacing_ms: 1500                # pause entre conversations (anti rate-limit ChatGPT)
parallel: 1                    # 2 = un service par domaine en parallele (profils isoles)

# Moteur navigateur : auto | playwright | botasaurus
#   auto       = Playwright, avec bascule Botasaurus si challenge anti-bot
#   playwright = Playwright seul
#   botasaurus = Botasaurus seul (Chrome patche, contournement Cloudflare)
engine: auto
botasaurus:
  chrome_executable_path: ""   # vide = auto-detection (Chromium Playwright, $AICV_CHROME_PATH)
  enable_xvfb: true            # Chrome headful dans Xvfb : contourne les challenges
                               # Cloudflare qui bloquent le headless pur. Requiert xvfb.

# scroll infini (chargement complet des fils de discussion)
scroll:
  max_rounds: 60
  pause_ms: 700
  stable_rounds: 3
# scroll de la sidebar (liste complete des conversations ; lazy-load exigeant)
sidebar:
  max_rounds: 40
  pause_ms: 700
  stable_rounds: 4

services:
  # Monitoring de similarite de forme des payloads API (references versionnees
  # dans tests/fixtures/api_shapes/, generees par scripts/api_bench.py) :
  #   api_health: {enabled: true, threshold: 95, on_break: warn}
  # `on_break: stop` arrete le service si un payload passe sous 80 % (BREAK).
  # Bilan ecrit dans exports/<plateforme>/api_health.json en fin de run.
  chatgpt:
    enabled: true
    url: https://chatgpt.com/
    api: true                  # backend-api (rapide) ; false = DOM (requis pour --variants)
  claude:
    enabled: true
    url: https://claude.ai/chats
    api: true                  # REST /api/organizations (rapide) ; false = DOM
    engine: botasaurus         # Cloudflare bloque Playwright sur claude.ai
  gemini:
    enabled: true
    url: https://gemini.google.com/app
    api: true                  # batchexecute (opt-in) ; absent/false = DOM
    pacing_ms: 3000            # l'API batchexecute limite le debit en rafale
  perplexity:
    enabled: true
    url: https://www.perplexity.ai/
    engine: botasaurus         # Cloudflare bloque Playwright + decouverte API GraphQL
    pacing_ms: 3000            # le quota gratuit n'aimait pas les rafales de lecture
  # Grok : API HTTP + cookies (Chromium bloque par Cloudflare, pas de navigateur)
  grok:
    enabled: true
    url: https://grok.com/
  mistral:
    enabled: true
    url: https://chat.mistral.ai/work
    api: true                  # tRPC /api/trpc (cookies) ; false = DOM
    engine: botasaurus         # Cloudflare bloque Playwright
